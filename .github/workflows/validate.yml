name: ea-code-validator

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Run validator tests
        run: pytest .opencode/skills/ea-code-validator/tests -v

      - name: Validator on repo (all rules blocking)
        run: python .opencode/skills/ea-code-validator/cli.py
